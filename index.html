<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>BelarusGuessor</title>

  <script src="https://api-maps.yandex.ru/2.1/?apikey=ТВОЙ_КЛЮЧ&lang=ru_RU"></script>
</head>
<body>

<h2>BelarusGuessor</h2>
<div id="panorama" style="width:100%; height:400px;"></div>

<script>
ymaps.ready(() => {
  const coords = [53.9, 27.5667]; // Минск для теста

  ymaps.panorama.locate(coords).then(pans => {
    if (!pans.length) return;

    new ymaps.panorama.Player(
      'panorama',
      pans[0],
      { direction: [0, -20] }
    );
  });
});
</script>

</body>
</html>
