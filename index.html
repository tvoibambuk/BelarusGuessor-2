<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BelarusGuessor - Угадай локацию в Беларуси</title>
    
    <!-- Подключаем Leaflet CSS и JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* Кнопки меню */
        .menu {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .menu-btn {
            background: white;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .menu-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        /* Игровой контейнер */
        .game-container {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none; /* Сначала скрыт */
        }

        .game-header {
            background: #2c3e50;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-stats {
            display: flex;
            gap: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        .game-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            height: 600px;
        }

        @media (max-width: 768px) {
            .game-content {
                grid-template-columns: 1fr;
                height: 800px;
            }
        }

        .panorama-container {
            position: relative;
            background: #f8f9fa;
        }

        #panorama {
            width: 100%;
            height: 100%;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
        }

        .map-container {
            position: relative;
            border-left: 2px solid #e0e0e0;
        }

        @media (max-width: 768px) {
            .map-container {
                border-left: none;
                border-top: 2px solid #e0e0e0;
            }
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .game-controls {
            padding: 20px;
            background: #f8f9fa;
            border-top: 2px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .guess-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .guess-btn:hover:not(:disabled) {
            background: #219653;
            transform: translateY(-2px);
        }

        .guess-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        /* Анимации */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        /* Таблица рекордов */
        .leaderboard-container {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .scores-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .scores-table th,
        .scores-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .scores-table th {
            background: #f8f9fa;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Заголовок -->
        <div class="header">
            <h1>🇧🇾 BelarusGuessor</h1>
            <p>Угадай локацию в Беларуси по панораме улиц!</p>
        </div>

        <!-- Меню -->
        <div class="menu">
            <button class="menu-btn" onclick="startGame()">🎮 Начать игру</button>
            <button class="menu-btn" onclick="showLeaderboard()">🏆 Таблица рекордов</button>
            <button class="menu-btn" onclick="showInstructions()">❓ Как играть</button>
        </div>

        <!-- Игровой контейнер -->
        <div class="game-container" id="gameContainer">
            <div class="game-header">
                <div class="game-title">
                    <h2>Раунд <span id="currentRound">1</span> из <span id="totalRounds">5</span></h2>
                </div>
                <div class="game-stats">
                    <div class="stat">
                        <div class="stat-value" id="totalScore">0</div>
                        <div class="stat-label">ОЧКИ</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="timer">0</div>
                        <div class="stat-label">СЕКУНДЫ</div>
                    </div>
                </div>
            </div>

            <div class="game-content">
                <div class="panorama-container">
                    <div id="panorama">
                        <div style="text-align: center;">
                            <h3>Загрузка панорамы...</h3>
                            <p>Изучите местность и отметьте ваше предположение на карте</p>
                        </div>
                    </div>
                </div>
                <div class="map-container">
                    <div id="map"></div>
                </div>
            </div>

            <div class="game-controls">
                <div>
                    <button class="guess-btn" id="guessBtn" disabled>
                        🎯 Угадать местоположение
                    </button>
                </div>
                <div>
                    <button onclick="skipRound()" style="background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer;">
                        Пропустить раунд
                    </button>
                </div>
            </div>
        </div>

        <!-- Таблица рекордов -->
        <div class="leaderboard-container" id="leaderboardContainer">
            <h2>Таблица рекордов</h2>
            <div id="leaderboardContent">
                <!-- Таблица будет загружена сюда -->
            </div>
            <div style="margin-top: 20px; text-align: center;">
                <button onclick="hideLeaderboard()" style="background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-right: 10px;">
                    Назад
                </button>
                <button onclick="clearLeaderboard()" style="background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer;">
                    Сбросить рекорды
                </button>
            </div>
        </div>
    </div>

    <script>
        // Конфигурация
        const YANDEX_API_KEY = "3f899af3-528f-4f87-a10b-2e52e388a17b";
        let map = null;
        let currentMarker = null;
        let gameState = {
            currentRound: 1,
            totalRounds: 5,
            totalScore: 0,
            currentLocation: null,
            playerGuess: null,
            gameStarted: false,
            timer: 0,
            timerInterval: null
        };

        // Локации для игры (упрощенный вариант)
        const locations = [
            { name: "Минск, пр. Независимости", lat: 53.917064, lon: 27.579236 },
            { name: "Брестская крепость", lat: 52.082599, lon: 23.655136 },
            { name: "Мирский замок", lat: 53.451178, lon: 26.472999 },
            { name: "Гродно, Советская площадь", lat: 53.677834, lon: 23.829369 },
            { name: "Гомель, дворец Румянцевых", lat: 52.422547, lon: 31.016780 },
            { name: "Витебск, ратуша", lat: 55.192981, lon: 30.202665 },
            { name: "Могилёв, площадь Ленина", lat: 53.894548, lon: 30.330754 },
            { name: "Полоцк, Софийский собор", lat: 55.485569, lon: 28.758294 }
        ];

        // Инициализация игры
        function startGame() {
            console.log("Запуск игры...");
            
            // Показываем игровой контейнер
            document.getElementById('gameContainer').style.display = 'block';
            document.getElementById('leaderboardContainer').style.display = 'none';
            
            // Сбрасываем состояние игры
            gameState = {
                currentRound: 1,
                totalRounds: 5,
                totalScore: 0,
                currentLocation: null,
                playerGuess: null,
                gameStarted: false,
                timer: 0
            };
            
            // Инициализируем карту
            initMap();
            
            // Начинаем первый раунд
            startRound();
            
            // Запускаем таймер
            startTimer();
        }

        function initMap() {
            console.log("Инициализация карты...");
            
            // Создаем карту с центром в Беларуси
            map = L.map('map').setView([53.9, 27.5], 7);
            
            // Добавляем слой OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 18
            }).addTo(map);
            
            // Обработчик клика по карте
            map.on('click', function(e) {
                if (!gameState.gameStarted) return;
                
                console.log("Клик по карте:", e.latlng);
                
                // Удаляем предыдущий маркер
                if (currentMarker) {
                    map.removeLayer(currentMarker);
                }
                
                // Добавляем новый маркер
                currentMarker = L.marker(e.latlng).addTo(map)
                    .bindPopup('Ваш выбор: ' + e.latlng.lat.toFixed(4) + ', ' + e.latlng.lng.toFixed(4))
                    .openPopup();
                
                gameState.playerGuess = e.latlng;
                
                // Активируем кнопку угадать
                document.getElementById('guessBtn').disabled = false;
                document.getElementById('guessBtn').classList.add('pulse');
            });
            
            console.log("Карта инициализирована");
        }

        function startRound() {
            console.log("Начало раунда", gameState.currentRound);
            
            gameState.gameStarted = true;
            gameState.playerGuess = null;
            gameState.timer = 0;
            
            // Очищаем предыдущий маркер
            if (currentMarker) {
                map.removeLayer(currentMarker);
                currentMarker = null;
            }
            
            // Деактивируем кнопку угадать
            document.getElementById('guessBtn').disabled = true;
            document.getElementById('guessBtn').classList.remove('pulse');
            
            // Выбираем случайную локацию
            const randomIndex = Math.floor(Math.random() * locations.length);
            gameState.currentLocation = locations[randomIndex];
            
            // Обновляем информацию о раунде
            document.getElementById('currentRound').textContent = gameState.currentRound;
            document.getElementById('totalRounds').textContent = gameState.totalRounds;
            document.getElementById('totalScore').textContent = gameState.totalScore;
            
            // Загружаем панораму (заглушка)
            loadPanorama();
            
            console.log("Локация выбрана:", gameState.currentLocation.name);
        }

        function loadPanorama() {
            const panoramaDiv = document.getElementById('panorama');
            
            // Заглушка вместо реальной панорамы
            panoramaDiv.innerHTML = `
                <div style="text-align: center; padding: 50px;">
                    <h3>🎯 ${gameState.currentLocation.name}</h3>
                    <p>Изучите местность и отметьте на карте где вы находитесь</p>
                    <p><small>Координаты реальной локации скрыты</small></p>
                    <div style="margin-top: 20px; background: #e0e0e0; padding: 20px; border-radius: 10px;">
                        <p>🌆 Здесь будет панорама улицы</p>
                        <p>Используется API Яндекс.Карт</p>
                    </div>
                </div>
            `;
        }

        function submitGuess() {
            if (!gameState.playerGuess) {
                alert("Сначала отметьте место на карте!");
                return;
            }
            
            console.log("Отправка догадки...");
            gameState.gameStarted = false;
            
            // Вычисляем расстояние
            const distance = calculateDistance(
                gameState.currentLocation.lat,
                gameState.currentLocation.lon,
                gameState.playerGuess.lat,
                gameState.playerGuess.lng
            );
            
            // Вычисляем очки
            const score = calculateScore(distance, gameState.timer);
            gameState.totalScore += score;
            
            // Показываем результат
            showRoundResult(distance, score);
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Радиус Земли в км
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function calculateScore(distance, timeTaken) {
            const MAX_POINTS = 5000;
            const DECAY_FACTOR = 0.002;
            const BONUS_TIME = 10;
            const BONUS_MULTIPLIER = 1.2;
            
            let score = MAX_POINTS * Math.exp(-DECAY_FACTOR * distance);
            
            if (timeTaken <= BONUS_TIME) {
                score *= BONUS_MULTIPLIER;
            }
            
            return Math.max(0, Math.round(score));
        }

        function showRoundResult(distance, score) {
            // Показываем alert с результатом
            const resultMessage = `
🎯 Результат раунда ${gameState.currentRound}:

📍 Реальная локация: ${gameState.currentLocation.name}
🗺️ Ваш выбор: ${gameState.playerGuess.lat.toFixed(4)}, ${gameState.playerGuess.lng.toFixed(4)}
📏 Расстояние: ${distance.toFixed(2)} км
⭐ Заработано очков: ${score}
💰 Общий счёт: ${gameState.totalScore}

${distance < 1 ? '🎉 Отлично! Почти попали в точку!' : 
  distance < 10 ? '👍 Хороший результат!' : 
  distance < 50 ? '😊 Неплохо!' : '💪 Попробуйте ещё раз!'}
            `;
            
            alert(resultMessage);
            
            // Переходим к следующему раунду или завершаем игру
            if (gameState.currentRound >= gameState.totalRounds) {
                endGame();
            } else {
                gameState.currentRound++;
                startRound();
            }
        }

        function startTimer() {
            clearInterval(gameState.timerInterval);
            gameState.timer = 0;
            
            gameState.timerInterval = setInterval(() => {
                if (gameState.gameStarted) {
                    gameState.timer++;
                    document.getElementById('timer').textContent = gameState.timer;
                }
            }, 1000);
        }

        function skipRound() {
            if (confirm("Пропустить этот раунд?")) {
                if (gameState.currentRound >= gameState.totalRounds) {
                    endGame();
                } else {
                    gameState.currentRound++;
                    startRound();
                }
            }
        }

        function endGame() {
            clearInterval(gameState.timerInterval);
            
            // Сохраняем результат
            saveScore(gameState.totalScore);
            
            alert(`🎊 Игра завершена!\n\nВаш финальный счёт: ${gameState.totalScore} очков\n\nПроверьте таблицу рекордов!`);
            
            // Показываем меню
            document.getElementById('gameContainer').style.display = 'none';
        }

        // Таблица рекордов
        function showLeaderboard() {
            document.getElementById('gameContainer').style.display = 'none';
            document.getElementById('leaderboardContainer').style.display = 'block';
            loadLeaderboard();
        }

        function hideLeaderboard() {
            document.getElementById('leaderboardContainer').style.display = 'none';
        }

        function loadLeaderboard() {
            const leaderboard = getLeaderboard();
            const container = document.getElementById('leaderboardContent');
            
            if (leaderboard.length === 0) {
                container.innerHTML = '<p style="text-align: center; padding: 20px;">Пока нет результатов</p>';
                return;
            }
            
            let html = '<table class="scores-table"><thead><tr><th>Место</th><th>Игрок</th><th>Очки</th><th>Дата</th></tr></thead><tbody>';
            
            leaderboard.forEach((entry, index) => {
                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${entry.name}</td>
                        <td>${entry.score}</td>
                        <td>${new Date(entry.date).toLocaleDateString()}</td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function saveScore(score) {
            const name = prompt("Введите ваше имя:", "Аноним") || "Аноним";
            const leaderboard = getLeaderboard();
            
            leaderboard.push({
                name: name,
                score: score,
                date: new Date().toISOString()
            });
            
            // Сортируем по убыванию очков и остав
